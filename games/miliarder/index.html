<!DOCTYPE html>
<html lang="id">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kuis Miliarder Bahasa Arab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff;overflow-x:hidden;
  background:
   radial-gradient(ellipse 80% 50% at 50% 0%,#2f4cecaa 0%,transparent 70%),
   radial-gradient(ellipse 70% 40% at 50% 100%,#6a22b066 0%,transparent 70%),
   linear-gradient(#060c44,#020418)}
button,input{font-family:inherit}
button{cursor:pointer;border:none;color:inherit}
.hidden{display:none!important}

/* ---------- LATAR ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.beams{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.beam{position:absolute;top:-12%;width:26vmax;height:150%;background:linear-gradient(#9db0ff66,#6f8bff18 60%,transparent);filter:blur(16px);transform-origin:50% 0;animation:sway 9s ease-in-out infinite alternate}
.beam:nth-child(1){left:2%;--a:-28deg;--b:-6deg}
.beam:nth-child(2){left:34%;--a:-10deg;--b:12deg;animation-duration:12s;opacity:.7}
.beam:nth-child(3){right:2%;--a:28deg;--b:6deg;animation-duration:10s}
@keyframes sway{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
.floor{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 100% at 50% 100%,#4f6bff55,transparent 70%)}
#start,#game{position:relative;z-index:1}

/* ---------- EMBLEM ---------- */
.emb{display:block;width:100%;height:100%;filter:drop-shadow(0 0 18px #4f6bffcc)}
.emb .spin{transform-origin:100px 100px;animation:rot 50s linear infinite}
.emb .spin2{transform-origin:100px 100px;animation:rot 35s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.emwrap{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}

/* ---------- START ---------- */
#start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:14px}
#start .emwrap{width:170px;height:170px}
h1{font-size:clamp(28px,7vw,50px);letter-spacing:2px;line-height:1.05;text-shadow:0 0 22px #4f6bff,0 3px 0 #0a1060}
h1 small{display:block;font-size:.42em;letter-spacing:6px;margin-top:8px;color:#ffc233;text-shadow:0 0 12px #ffb300aa}
.sub{max-width:480px;color:#c6d0ff;font-size:14.5px;line-height:1.55}
.sub b{color:#ffd24d}
.nameRow{display:flex;gap:8px;align-items:center}
.nameRow input{background:#ffffff14;border:2px solid #8da0ff88;border-radius:30px;padding:11px 18px;font-size:16px;color:#fff;text-align:center;outline:none;width:220px}
.nameRow input:focus{border-color:#ffc233;box-shadow:0 0 14px #ffc23388}
.btn{padding:14px 42px;font-size:18px;font-weight:bold;letter-spacing:1.5px;border-radius:40px;background:linear-gradient(#ffd24d,#ffa200 55%,#d97800);color:#1a1000;box-shadow:0 5px 0 #8a4a00,0 0 24px #ffb30077;text-shadow:0 1px 0 #ffffff66}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a4a00}
.btn.sec{background:linear-gradient(#6f84ff,#2a3ab0);color:#fff;box-shadow:0 4px 0 #141c5c;font-size:15px;padding:11px 26px;text-shadow:none}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.board{background:#0a1258aa;border:2px solid #8da0ff55;border-radius:16px;padding:12px 16px;min-width:270px;max-width:380px;width:100%}
.board h3{font-size:14px;letter-spacing:2px;color:#ffc233;margin-bottom:6px}
.board ol{list-style:none;font-size:14px}
.board li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #8da0ff33}
.board li:last-child{border:none}
.board li span:first-child{color:#c6d0ff}
.board li b{color:#ffd24d}
.board .empty{color:#8da0ff;font-size:13px;text-align:center;padding:6px}

/* ---------- GAME ---------- */
#game{min-height:100vh;display:grid;grid-template-columns:1fr 260px}
.main{display:flex;flex-direction:column;padding:12px 18px 18px;min-height:100vh;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lifelines{display:flex;gap:9px}
.ll{width:66px;height:42px;border-radius:50%/50%;font-weight:bold;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(#ffffff40,#ffffff00 50%),linear-gradient(#4b60e8,#16228a);border:2px solid #d5ddff;box-shadow:0 0 14px #4f6bff88,inset 0 -3px 6px #0006;transition:.2s}
.ll:active{transform:scale(.93)}
.ll.used{opacity:.42;filter:grayscale(.7);pointer-events:none}
.ll.used::after{content:"✕";position:absolute;color:#ff3b3b;font-size:40px;line-height:40px;font-weight:bold}
.tools{display:flex;gap:7px;flex-wrap:wrap}
.mini{padding:8px 11px;border-radius:20px;background:#ffffff1c;border:1px solid #ffffff44;font-size:13px}
.mini.walk{background:#b3440040;border-color:#ff9a3d}
.mini.off{opacity:.5;text-decoration:line-through}
.ltoggle{display:none}

/* panel uang */
.money{margin:12px auto 0;width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;align-items:stretch}
.mcol{background:linear-gradient(#ffffff18,#ffffff05),#0a1260cc;border:2px solid #8da0ff66;border-radius:14px;padding:7px 8px;text-align:center;box-shadow:0 0 16px #0006}
.mcol small{display:block;font-size:10.5px;letter-spacing:1.5px;color:#aebaff}
.mcol b{display:block;font-size:clamp(14px,3.4vw,20px);margin-top:2px;color:#fff}
.mcol.won b{color:#58f08a}
.mcol.safe b{color:#ffd24d}
.mcol.mid{border-color:#ffc233;background:linear-gradient(#ffc23330,#ffc23308),#1a1470dd;box-shadow:0 0 22px #ffc23355}
.mcol.mid b{font-size:clamp(17px,4.4vw,27px);color:#ffe27a;text-shadow:0 0 12px #ffb300}
.diff{display:inline-block;margin-top:3px;font-size:10px;font-weight:bold;letter-spacing:2px;padding:1px 9px;border-radius:10px;border:1px solid currentColor}
.prog{display:flex;gap:3px;margin:9px auto 0;width:100%;max-width:900px}
.seg{flex:1;height:8px;border-radius:4px;background:#ffffff22;position:relative}
.seg.safe{background:#ffffff55}
.seg.done{background:linear-gradient(#58f08a,#1faa36);box-shadow:0 0 8px #58f08a88}
.seg.now{background:linear-gradient(#ffd24d,#ff8a00);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0;min-height:90px}
.stage .emwrap{width:clamp(64px,15vh,128px);height:clamp(64px,15vh,128px)}

.qwrap{width:100%;max-width:900px;margin:0 auto}
.hexw{position:relative;filter:drop-shadow(0 0 7px #4f6bffaa) drop-shadow(0 3px 4px #0008)}
.hex{display:block;width:100%;position:relative;padding:3px;text-align:left;background:linear-gradient(#f1f4ff,#6a7cd8 60%,#3a4aa8);
  clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 50%,calc(100% - 28px) 100%,28px 100%,0 50%)}
.hex>.in{background:linear-gradient(#ffffff2e 0,#ffffff00 46%),linear-gradient(#1f31b8,#0c1470 55%,#070d4c);
  clip-path:polygon(27px 0,calc(100% - 27px) 0,100% 50%,calc(100% - 27px) 100%,27px 100%,0 50%);display:flex;align-items:center;padding:13px 46px;min-height:56px}
.q{margin-bottom:14px}
.q .in{justify-content:center;text-align:center;font-size:clamp(15px,2.7vw,22px);min-height:88px;line-height:1.5;unicode-bidi:plaintext}
.q::before,.q::after{content:"";position:absolute;top:50%;height:3px;width:60px;background:linear-gradient(90deg,transparent,#8da0ff)}
.q::before{left:-62px}
.q::after{right:-62px;transform:scaleX(-1)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px}
.ans{transition:.18s}
.ans .in{gap:10px;font-size:clamp(14px,2.4vw,20px);min-height:54px}
.ans .lt{color:#ffc233;font-weight:bold;text-shadow:0 0 8px #ffb30088}
.ans .tx{flex:1;unicode-bidi:plaintext}
.ans:not(.off):hover{transform:scale(1.015)}
.ans.sel{filter:drop-shadow(0 0 14px #ffb300) drop-shadow(0 3px 4px #0008)}
.ans.sel .hex{background:linear-gradient(#fff0b0,#ffa200)}
.ans.sel .in{background:linear-gradient(#ffffff40 0,#ffffff00 46%),linear-gradient(#ffb21f,#d96f00);color:#1a0d00}
.ans.sel .lt{color:#fff;text-shadow:none}
.ans.ok{filter:drop-shadow(0 0 16px #3dff6a) drop-shadow(0 3px 4px #0008)}
.ans.ok .hex{background:linear-gradient(#caffd0,#1faa36)}
.ans.ok .in{background:linear-gradient(#ffffff40 0,#ffffff00 46%),linear-gradient(#2fd24a,#0c7a21)}
.ans.ok .lt{color:#fff;text-shadow:none}
.ans.bad{filter:drop-shadow(0 0 16px #ff3b3b) drop-shadow(0 3px 4px #0008)}
.ans.bad .hex{background:linear-gradient(#ffc0c0,#cc2020)}
.ans.bad .in{background:linear-gradient(#ffffff40 0,#ffffff00 46%),linear-gradient(#e03030,#8a0f0f)}
.ans.bad .lt{color:#fff;text-shadow:none}
.ans.blink.ok .in{animation:bl .3s steps(2) 6}
@keyframes bl{50%{background:#0a1266}}
.ans.off{opacity:0;pointer-events:none}
.confirm{display:flex;justify-content:center;gap:12px;margin-top:14px;min-height:50px;align-items:center}
.confirm .btn{padding:10px 26px;font-size:16px}
.locktxt{color:#ffc233;font-size:18px;letter-spacing:3px;animation:pulse .8s ease-in-out infinite}

/* ---------- TANGGA HADIAH ---------- */
.ladder{background:linear-gradient(#050a38e8,#030620f0);border-left:2px solid #4f6bff66;padding:12px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;box-shadow:-8px 0 30px #0008}
.ladder h4{text-align:center;font-size:12px;letter-spacing:3px;color:#ffc233;margin-bottom:6px}
.lrow{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:7px;font-weight:bold;font-size:14.5px;color:#ffb300;border:1px solid transparent;transition:.3s}
.lrow .n{width:22px;text-align:right}
.lrow .d{font-size:10px}
.lrow .a{flex:1}
.lrow .t{font-size:10px;letter-spacing:1px;min-width:34px;text-align:right}
.lrow.safe{color:#fff;background:#ffffff14;border-color:#ffffff33}
.lrow.safe .d{color:#fff}
.lrow.done{color:#58f08a;background:#1faa3622}
.lrow.done.safe{color:#fff}
.lrow.now{background:linear-gradient(#ffd24d,#ff9a00);color:#1a1000;box-shadow:0 0 18px #ffb300aa;transform:scale(1.04);border-color:#fff4}

/* ---------- MODAL & BANNER ---------- */
#modal{position:fixed;inset:0;background:#000000bb;display:flex;align-items:center;justify-content:center;padding:18px;z-index:80;backdrop-filter:blur(3px)}
.box{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:linear-gradient(#ffffff1c,#ffffff00 30%),linear-gradient(#1a29a8,#0a1060);border:3px solid #d5ddff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 0 50px #4f6bffcc;animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.box h2{margin-bottom:10px;font-size:23px;color:#ffc233;text-shadow:0 0 12px #ffb30088}
.box p{line-height:1.55;color:#e4e9ff;margin-bottom:6px}
.box ul{text-align:left;padding-left:20px;line-height:1.6;color:#e4e9ff;font-size:14.5px}
.box .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.box .btn{padding:11px 26px;font-size:16px}
.bars{display:flex;justify-content:center;align-items:flex-end;gap:16px;height:160px;margin:14px 0 4px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:52px;height:100%;font-size:13px}
.bar i{display:block;width:100%;background:linear-gradient(#ffd24d,#e07b00);border-radius:6px 6px 0 0;min-height:2px;transition:height 1s}
.bar span{margin-top:4px;font-weight:bold;color:#ffc233}
.big{font-size:32px;color:#ffe27a;font-weight:bold;margin:8px 0;text-shadow:0 0 16px #ffb300}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:13px}
.stats div{background:#ffffff14;border-radius:10px;padding:8px}
.stats b{display:block;font-size:17px;color:#fff}
#banner{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
#banner.show{opacity:1}
.bn{text-align:center;padding:22px 36px;border-radius:24px;background:linear-gradient(#ffffff22,#ffffff00 40%),linear-gradient(#0f6a2cee,#063a18ee);border:3px solid #7dffa0;box-shadow:0 0 60px #3dff6a99;animation:pop .35s}
.bn small{display:block;font-size:15px;letter-spacing:5px;color:#aaffc0}
.bn b{display:block;font-size:clamp(28px,8vw,46px);margin:6px 0;color:#fff;text-shadow:0 0 18px #3dff6a}
.bn em{display:block;font-style:normal;color:#ffe27a;font-size:14px;letter-spacing:1px}

/* ---------- MOBILE ---------- */
@media (max-width:860px){
  #game{grid-template-columns:1fr}
  .ladder{position:fixed;top:0;right:0;bottom:0;width:250px;z-index:60;transform:translateX(105%);transition:.25s}
  .ladder.open{transform:none}
  .ltoggle{display:inline-block}
  .answers{grid-template-columns:1fr;gap:9px}
  .q::before,.q::after{display:none}
  .ll{width:56px;height:38px;font-size:12px}
  .hex>.in{padding:11px 34px}
  .main{padding:10px 12px 16px}
  .mcol{padding:6px 4px}
  .mcol small{font-size:9px;letter-spacing:1px}
}
@media (max-height:640px){.stage{display:none}}

/* ================= V2 VISUAL DETAIL ================= */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinA{to{--a:360deg}}
:root{color-scheme:dark;--ar:Amiri,"Noto Naskh Arabic","Traditional Arabic","Geeza Pro",serif;--disp:Cinzel,"Trebuchet MS",Georgia,serif;--ray:#ffd24d22;--gold:linear-gradient(#fff6c8,#ffc233 52%,#c77a00)}
body.tense{--ray:#ff5a3a44}

/* latar berlapis */
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;background-size:96px 96px;animation:patMove 120s linear infinite;-webkit-mask:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 85%);mask:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 85%)}
@keyframes patMove{to{background-position:96px 96px}}
.vig{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,#000000b0 100%)}
.calli{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;white-space:nowrap;font-family:var(--ar);font-size:min(24vw,300px);line-height:1;color:#8da0ff;opacity:.05}
.rig{position:fixed;top:0;left:0;right:0;height:30px;z-index:0;pointer-events:none;display:flex;justify-content:space-around;padding:0 3%}
.rig::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(#34459e,#0a1060);border-bottom:1px solid #8da0ff66}
.lamp{width:30px;height:16px;margin-top:5px;border-radius:2px 2px 16px 16px;background:radial-gradient(ellipse at 50% 100%,#fff,#b8c6ff 40%,#3a4fd0);box-shadow:0 6px 24px 4px #9db0ffaa;animation:lampA 3.4s ease-in-out infinite alternate}
.lamp:nth-child(2n){animation-delay:-1.2s}
.lamp:nth-child(3n){animation-delay:-2.3s}
@keyframes lampA{from{opacity:.5}to{opacity:1}}
body.tense .lamp{background:radial-gradient(ellipse at 50% 100%,#fff,#ffb0a0 40%,#d03020);box-shadow:0 6px 24px 4px #ff5a3aaa;animation-duration:.8s}
body.tense .beam{filter:blur(16px) hue-rotate(150deg) saturate(2)}
.floor{height:30vh;overflow:hidden}
.floor::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-25%;height:150%;background:repeating-linear-gradient(90deg,#6f8bff2e 0 2px,transparent 2px 64px),repeating-linear-gradient(0deg,#6f8bff2e 0 2px,transparent 2px 44px);background-position:0 0,0 0;transform:perspective(320px) rotateX(64deg);transform-origin:bottom;-webkit-mask:linear-gradient(transparent,#000 75%);mask:linear-gradient(transparent,#000 75%);animation:gridMove 5s linear infinite}
@keyframes gridMove{to{background-position:0 0,0 44px}}
.ember{position:fixed;bottom:-10px;border-radius:50%;background:#ffd24d;box-shadow:0 0 8px 2px #ffb300;opacity:0;z-index:0;pointer-events:none;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}100%{transform:translate(var(--dx),-105vh);opacity:0}}
.tenseov{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,#ff2a2a66 100%);transition:opacity .6s}
body.tense .tenseov{opacity:1;animation:tp .9s ease-in-out infinite alternate}
@keyframes tp{from{opacity:.35}to{opacity:1}}
.flashov{position:fixed;inset:0;z-index:66;pointer-events:none;opacity:0}
.flashov.ok{background:radial-gradient(circle,#3dff6a66,transparent 70%);animation:fl .9s}
.flashov.bad{background:radial-gradient(circle,#ff3b3b77,transparent 70%);animation:fl .9s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
body.shake .main{animation:shake .55s}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-10px)}30%{transform:translateX(9px)}45%{transform:translateX(-7px)}60%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
#fxc{position:fixed;inset:0;width:100%;height:100%;z-index:65;pointer-events:none}

/* emblem */
.emwrap{position:relative;isolation:isolate}
.emwrap::before{content:"";position:absolute;inset:-45%;z-index:-1;border-radius:50%;background:repeating-conic-gradient(from var(--a),var(--ray) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spinA 70s linear infinite}
body.tense .emwrap::before{animation-duration:9s}
.emb .orbit{transform-origin:100px 100px;animation:rot 9s linear infinite}
.emb .ringtxt{transform-origin:100px 100px;animation:rot 60s linear infinite reverse}
body.tense .emb .orbit{animation-duration:2.2s}
.emb{filter:drop-shadow(0 0 16px #4f6bffcc) drop-shadow(0 6px 10px #0009)}
body.tense .emb{filter:drop-shadow(0 0 18px #ff5a3acc) drop-shadow(0 6px 10px #0009)}

/* layar awal */
#start{overflow:hidden;padding-top:44px}
h1{font-family:var(--disp);font-weight:800;background:linear-gradient(#fff,#cfd8ff 45%,#8da0ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #0a1060) drop-shadow(0 0 18px #4f6bffcc)}
h1 small{font-family:var(--disp);font-weight:600;color:#ffc233}
.orn{display:flex;align-items:center;gap:10px;width:min(320px,70vw)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#ffc233)}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:9px;height:9px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 10px #ffc233}
.board li:nth-child(1) span:first-child{color:#ffd24d;font-weight:700}
.board li:nth-child(2) span:first-child{color:#dfe6ff;font-weight:700}
.board li:nth-child(3) span:first-child{color:#e0a070;font-weight:700}
.board h3,.box h2{font-family:var(--disp)}

/* game */
.main{padding-top:36px}
.ll svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #9db0ff)}
.ll .f{font-family:var(--disp);font-weight:800;letter-spacing:.5px}
.mcol b{font-family:var(--disp);font-weight:800;letter-spacing:.5px}
.mcol.mid{position:relative;overflow:hidden}
.mcol.mid::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff33 50%,transparent 60%);transform:translateX(-130%);animation:sheen 4s infinite}
.mcol.mid b{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 8px #ffb30088)}
.mcol.won b::before,.mcol.safe b::before{content:"";display:inline-block;width:.62em;height:.62em;margin-right:.35em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffc233 55%,#a85d00);box-shadow:0 0 6px #ffc233}
.mcol.won b::before{background:radial-gradient(circle at 35% 30%,#d8ffe0,#58f08a 55%,#0c7a21);box-shadow:0 0 6px #58f08a}
.seg.safe::after{content:"";position:absolute;left:50%;top:-4px;width:6px;height:6px;margin-left:-3px;transform:rotate(45deg);background:var(--gold)}

/* kotak hex berornamen */
.hex>.in{position:relative;overflow:hidden;box-shadow:inset 0 0 18px #4f6bff55,inset 0 -10px 18px #00000066}
.hex>.in::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff40 50%,transparent 60%);transform:translateX(-130%);pointer-events:none}

.ans:nth-child(1){animation-delay:.12s}
.ans:nth-child(2){animation-delay:.24s;--from:40px}
.ans:nth-child(3){animation-delay:.36s}
.ans:nth-child(4){animation-delay:.48s;--from:40px}
@keyframes ansIn{from{opacity:0;transform:translateX(calc(var(--from,-40px))) scale(.96)}}
.ans .lt{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b0,#ffb300 55%,#a85d00);color:#2a1600;text-shadow:none;font-weight:800;font-size:15px;box-shadow:0 0 10px #ffb30088,inset 0 -2px 3px #0005}
.ans.sel .lt{background:radial-gradient(circle at 35% 30%,#fff,#ffe9a0 60%,#d99a00);color:#1a0d00}
.ans.ok .lt,.ans.bad .lt{background:radial-gradient(circle at 35% 30%,#fff,#e8e8e8 60%,#aaa);color:#222}

.q .ar{font-size:1.5em}
.ans.sel .ar{color:#3a1d00;text-shadow:none}
.ans.ok .ar,.ans.bad .ar{color:#fff;text-shadow:0 0 8px #0006}

/* tangga hadiah */
.ladder h4{font-family:var(--disp);font-size:13px;display:flex;align-items:center;gap:8px}
.ladder h4::before,.ladder h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#ffc233aa)}
.ladder h4::after{transform:scaleX(-1)}
.lrow{font-family:var(--disp);font-weight:800;background:linear-gradient(90deg,#ffffff0d,transparent);position:relative;overflow:hidden;padding-left:14px}
.lrow::before{content:"";position:absolute;left:0;top:15%;bottom:15%;width:3px;border-radius:2px;background:#ffffff22}
.lrow.safe::before{background:#ffc233}
.lrow.done::before{background:#58f08a;box-shadow:0 0 8px #58f08a}
.lrow.now::before{background:#fff}
.lrow.now::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff66 50%,transparent 60%);transform:translateX(-130%);animation:sheen 2.2s infinite}

/* modal & banner */
.box{position:relative}
.box::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from var(--a) at 50% 30%,#ffd24d14 0 7deg,transparent 7deg 20deg);animation:spinA 60s linear infinite}

.big{font-family:var(--disp);background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 12px #ffb30099)}

    ticks+=`<line x1="${100+86*Math.cos(a)}" y1="${100+86*Math.sin(a)}" x2="${100+(86-l)*Math.cos(a)}" y2="${100+(86-l)*Math.sin(a)}" stroke="url(#gGold)" stroke-width="${i%4===0?2.4:1.2}"/>`;}

    <g class="spin">${ticks}</g>

/* ===================== EFEK LATAR (bintang + confetti) ===================== */
const cv = $('fx'), cx = cv.getContext('2d');
let W=0,H=0, stars=[], conf=[];
function resize(){
  const d=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight; cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:Math.random()*.02+.005}));
}
addEventListener('resize',resize); resize();
function burst(n,big){
  const cols=['#ffd24d','#ff8a00','#58f08a','#6f8bff','#ff4d9a','#fff'];
  for(let i=0;i<n;i++) conf.push({x:W/2,y:H*.4,vx:(Math.random()-.5)*(big?16:10),vy:-Math.random()*(big?15:9)-3,w:Math.random()*8+4,h:Math.random()*5+3,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
}
(function loop(){
  cx.clearRect(0,0,W,H);
  stars.forEach(s=>{s.p+=s.s;cx.globalAlpha=.25+.55*Math.abs(Math.sin(s.p));cx.fillStyle='#cfd8ff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill();});
  conf=conf.filter(c=>c.life>0);
  conf.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.35;c.vx*=.99;c.rot+=c.vr;c.life-=.008;cx.globalAlpha=Math.max(c.life,0);cx.save();cx.translate(c.x,c.y);cx.rotate(c.rot);cx.fillStyle=c.c;cx.fillRect(-c.w/2,-c.h/2,c.w,c.h);cx.restore();});
  cx.globalAlpha=1;
  requestAnimationFrame(loop);
})();

/* ===================== AUDIO: SFX + MUSIK TEGANG ===================== */
const Aud = {
  ctx:null, mus:null, sfx:null, bus:null, noise:null,
  musicOn:store.get('kmba_music',true), sfxOn:store.get('kmba_sfx',true),
  timer:null, step:0, nextT:0, level:0, susp:false,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=this.ctx=new C();
    const comp=c.createDynamicsCompressor(); comp.connect(c.destination);
    const master=c.createGain(); master.gain.value=.9; master.connect(comp);
    this.mus=c.createGain(); this.mus.gain.value=this.musicOn?.55:0; this.mus.connect(master);
    this.sfx=c.createGain(); this.sfx.gain.value=this.sfxOn?1:0; this.sfx.connect(master);
    // bus musik dengan gema
    this.bus=c.createGain(); this.bus.connect(this.mus);
    const d=c.createDelay(); d.delayTime.value=.3;
    const fb=c.createGain(); fb.gain.value=.38;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600;
    this.bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(this.mus);
    // buffer noise
    const len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=Math.random()*2-1;
    this.noise=buf;
  },
  setMusic(on){ this.musicOn=on; store.set('kmba_music',on); if(this.mus) this.mus.gain.value=on?.55:0; },
  setSfx(on){ this.sfxOn=on; store.set('kmba_sfx',on); if(this.sfx) this.sfx.gain.value=on?1:0; },
  n(freq,t,dur,type='sine',vol=.1,o={}){
    const c=this.ctx; if(!c) return;
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t);
    if(o.end) osc.frequency.exponentialRampToValueAtTime(o.end,t+dur);
    if(o.det) osc.detune.value=o.det;
    if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.lp,t);if(o.lpEnd)f.frequency.exponentialRampToValueAtTime(o.lpEnd,t+dur);osc.connect(f);f.connect(g);}
    else osc.connect(g);
    const a=o.a||.005;
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    g.connect(o.dest||this.sfx); osc.start(t); osc.stop(t+dur+.05);
  },
  now(){ return this.ctx?this.ctx.currentTime:0; },
  /* ---- efek ---- */
  select(){ if(!this.ctx)return; const t=this.now(); this.n(520,t,.12,'triangle',.18); this.n(780,t+.07,.14,'triangle',.14); },
  lock(){ if(!this.ctx)return; const t=this.now(); this.n(180,t,.5,'sawtooth',.16,{lp:700,lpEnd:150}); this.n(90,t,.6,'sine',.4); },
  life(){ if(!this.ctx)return; const t=this.now(); [500,700,950].forEach((f,i)=>this.n(f,t+i*.08,.18,'sine',.16)); },
  right(){ if(!this.ctx)return; const t=this.now(); [523,659,784,1047].forEach((f,i)=>this.n(f,t+i*.11,.4,'triangle',.2)); this.n(262,t,.9,'sawtooth',.07,{lp:900}); },
  wrong(){ if(!this.ctx)return; const t=this.now(); [330,277,233,175].forEach((f,i)=>this.n(f,t+i*.2,.5,'sawtooth',.14,{lp:1200})); this.n(70,t,1.2,'sine',.5); },
  win(){ if(!this.ctx)return; const t=this.now(); [523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>{this.n(f,t+i*.15,.45,'triangle',.22);this.n(f/2,t+i*.15,.45,'square',.05,{lp:1200});}); },
  riser(){
    const c=this.ctx; if(!c||!this.noise) return; const t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.noise; s.loop=true;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=2.5;
    f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(5000,t+2.4);
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.22,t+2.3); g.gain.linearRampToValueAtTime(.0001,t+2.6);
    s.connect(f); f.connect(g); g.connect(this.bus); s.start(t); s.stop(t+2.7);
  },
  /* ---- musik tegang (dibuat prosedural, orisinal) ---- */
  startMusic(level){
    if(!this.ctx) return; this.level=level; this.susp=false;
    if(this.timer) return;
    this.step=0; this.nextT=this.ctx.currentTime+.15;
    this.timer=setInterval(()=>this.sched(),60);
  },
  stopMusic(){ clearInterval(this.timer); this.timer=null; this.susp=false; },
  setLevel(l){ this.level=l; },
  setSusp(b){ this.susp=b; if(b) this.riser(); },
  inten(){ return Math.min(1,this.level/14*.65+(this.susp?.4:0)); },
  dur(){ const bpm=78+this.level*3.4+(this.susp?24:0); return 60/bpm/2; },
  sched(){
    const c=this.ctx; if(!c) return;
    if(this.nextT<c.currentTime-.4) this.nextT=c.currentTime+.05;
    while(this.nextT<c.currentTime+.22){ this.play(this.step,this.nextT); this.nextT+=this.dur(); this.step++; }
  },
  play(s,t){
    const i=s%8, bar=Math.floor(s/8)%4, I=this.inten(), D=this.dur(), B=this.bus;
    const f=m=>440*Math.pow(2,(m-69)/12);
    const root=[45,41,38,40][bar];
    // bas bergetar
    if(i===0||i===3||i===6) this.n(f(root),t,D*1.7,'sawtooth',.17,{dest:B,lp:380+I*620,lpEnd:110});
    // detak jantung
    if(i===0||i===2) this.n(125,t,.16,'sine',.42-(i?0.12:0),{dest:B,end:42});
    // arpeggio
    const iv=[[0,3,7,12,7,3,7,3],[0,4,7,12,7,4,7,4],[0,3,7,12,7,3,7,3],[0,4,7,13,7,4,7,1]][bar];
    this.n(f(root+24+iv[i]),t,D*.95,'triangle',.04+.035*I,{dest:B});
    if(I>.5) this.n(f(root+36+iv[(i+4)%8]),t+D/2,D*.5,'sine',.025,{dest:B});
    // pad string tegang
    if(i===0){
      const L=D*8;
      this.n(f(root+12),t,L,'sawtooth',.05+.03*I,{dest:B,a:L*.4,lp:800+I*600,det:-7});
      this.n(f(root+(bar===3?16:15)),t,L,'sawtooth',.04+.025*I,{dest:B,a:L*.4,lp:800+I*600,det:7});
      this.n(f(root+19),t,L,'sawtooth',.03,{dest:B,a:L*.5,lp:700});
    }
    // sting tinggi yang bikin gelisah
    if(I>.35 && i%2===1 && Math.random()<.22) this.n(f(root+36+[0,1,6,10][Math.floor(Math.random()*4)]),t,.35,'sine',.035,{dest:B});
    // tik jam saat suspense
    if(this.susp){ this.n(1900,t,.05,'square',.03,{dest:B}); this.n(1500,t+D/2,.04,'square',.02,{dest:B}); }
  }
};
document.addEventListener('visibilitychange',()=>{ if(!Aud.ctx) return; if(document.hidden) Aud.ctx.suspend(); else Aud.ctx.resume(); });

/* ===================== STATE ===================== */
let level=0, cur=null, used={}, locked=false, selected=null, correctCount=0, pname='Pemain';
let seen = new Set((window.__MARKAZ_GAME_SETUP||{}).miliarderDB?[]:store.get('kmba_seen',[]));

function pickQuestion(lv, exclude){
  const all=[]; DB.forEach((q,i)=>{ if(q[0]===lv+1) all.push(i); });
  let pool=all.filter(i=>!seen.has(i) && i!==exclude);
  if(!pool.length){ all.forEach(i=>seen.delete(i)); pool=all.filter(i=>i!==exclude); if(!pool.length) pool=all; }
  const id=pool[Math.floor(Math.random()*pool.length)];
  seen.add(id); store.set('kmba_seen',[...seen]);
  const q=DB[id];
  const opts=[q[2],q[3],q[4],q[5]].map((t,k)=>({t,ok:k===0}));
  for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return {id,q:q[1],opts};
}
const safePrize = () => level>9?PRIZES[9]:level>4?PRIZES[4]:0;
const wonPrize = () => level>0?PRIZES[level-1]:0;

/* ===================== UI ===================== */
function buildLadder(){
  const el=$('ladder'); el.innerHTML='<h4>TANGGA HADIAH</h4>';
  for(let i=14;i>=0;i--){
    const r=document.createElement('div'); r.className='lrow'+(SAFE.includes(i)?' safe':''); r.id='row'+i;
    r.innerHTML=`<span class="n">${i+1}</span><span class="d">◆</span><span class="a">${rp(PRIZES[i])}</span><span class="t"></span>`;
    el.appendChild(r);
  }
  const p=$('prog'); p.innerHTML='';
  for(let i=0;i<15;i++){ const s=document.createElement('div'); s.className='seg'+(SAFE.includes(i)?' safe':''); s.id='seg'+i; p.appendChild(s); }
}
let lastWon=0;
function countTo(el,from,to){
  const t0=performance.now(), D=900;
  (function f(t){ const k=Math.min(1,(t-t0)/D); el.textContent=rp(Math.round(from+(to-from)*k)); if(k<1) requestAnimationFrame(f); })(t0);
}
function updateUI(){
  for(let i=0;i<15;i++){
    const r=$('row'+i), sg=$('seg'+i);
    r.classList.toggle('now',i===level); r.classList.toggle('done',i<level);
    r.querySelector('.t').textContent = i<level?(SAFE.includes(i)?'🔒':'✓'):(SAFE.includes(i)?'AMAN':'');
    sg.classList.toggle('now',i===level); sg.classList.toggle('done',i<level);
  }
  const w=wonPrize(); countTo($('mWon'),lastWon,w); lastWon=w;
  $('mNow').textContent=rp(PRIZES[level]);
  $('mSafe').textContent=rp(safePrize());
  $('mQ').textContent=`SOAL ${level+1} / 15`;
  const [dn,dc]=DIFF(level); const d=$('mDiff'); d.textContent=dn; d.style.color=dc;
}

function renderQuestion(){
  $('qText').textContent=cur.q;
  $('confirm').innerHTML='';
  const box=$('answers'); box.innerHTML='';
  cur.opts.forEach((o,i)=>{
    const w=document.createElement('div'); w.className='ans hexw'; w.id='ans'+i;
    w.innerHTML=`<button class="hex"><div class="in"><span class="lt">${'ABCD'[i]}:</span><span class="tx" dir="auto"></span></div></button>`;
    w.querySelector('.tx').textContent=o.t;
    w.querySelector('button').onclick=()=>choose(i);
    box.appendChild(w);
  });
}
function loadQuestion(){
  cur=pickQuestion(level); locked=false; selected=null;
  renderQuestion(); updateUI(); Aud.setLevel(level);
  $('ladder').classList.remove('open');
}

function choose(i){
  if(locked) return;
  const el=$('ans'+i); if(el.classList.contains('off')) return;
  selected=i; Aud.select();
  cur.opts.forEach((_,k)=>$('ans'+k).classList.toggle('sel',k===i));
  $('confirm').innerHTML=`<button class="btn" id="bYes">KUNCI JAWABAN</button><button class="btn sec" id="bNo">Batal</button>`;
  $('bYes').onclick=lockAnswer; $('bNo').onclick=cancelSel;
}
function cancelSel(){ selected=null; $('confirm').innerHTML=''; cur.opts.forEach((_,k)=>$('ans'+k).classList.remove('sel')); }

function lockAnswer(){
  if(selected===null||locked) return;
  locked=true; Aud.lock(); Aud.setSusp(true);
  $('confirm').innerHTML='<span class="locktxt">JAWABAN DIKUNCI…</span>';
  setTimeout(reveal,2700);
}

function showBanner(html,ms){
  const b=$('banner'); b.innerHTML=html; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),ms);
}

function reveal(){
  Aud.setSusp(false);
  const correct=cur.opts.findIndex(o=>o.ok);
  $('confirm').innerHTML='';
  const sel=$('ans'+selected); sel.classList.remove('sel');
  if(selected===correct){
    sel.classList.add('ok','blink'); correctCount++;
    const prize=PRIZES[level], isSafe=SAFE.includes(level);
    if(level===14){
      Aud.stopMusic(); Aud.win(); burst(220,true);
      setTimeout(()=>burst(160,true),700);
      showBanner(`<div class="bn"><small>LUAR BIASA!</small><b>${rp(prize)}</b><em>🏆 HADIAH UTAMA 🏆</em></div>`,2800);
      setTimeout(()=>endGame('win'),3000);
    } else {
      Aud.right(); burst(isSafe?110:50,isSafe);
      showBanner(`<div class="bn"><small>BENAR!</small><b>${rp(prize)}</b><em>${isSafe?'🔒 TITIK AMAN TERCAPAI — hadiah ini dijamin':'Hadiah Anda sekarang'}</em></div>`,2300);
      setTimeout(()=>{ level++; loadQuestion(); },2500);
    }
  } else {
    sel.classList.add('bad'); $('ans'+correct).classList.add('ok');
    Aud.stopMusic(); Aud.wrong();
    setTimeout(()=>endGame('lose'),2800);
  }
}

/* ===================== AKHIR GAME ===================== */
function saveScore(prize){
  const list=store.get('kmba_scores',[]);
  list.push({n:pname,p:prize,c:correctCount});
  list.sort((a,b)=>b.p-a.p||b.c-a.c);

function terbilang(n){
  const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  n=Math.floor(n);
  if(n<12) return s[n]||'nol';
  if(n<20) return terbilang(n-10)+' belas';
  if(n<100) return terbilang(Math.floor(n/10))+' puluh'+(n%10?' '+terbilang(n%10):'');
  if(n<200) return 'seratus'+(n-100?' '+terbilang(n-100):'');
  if(n<1000) return terbilang(Math.floor(n/100))+' ratus'+(n%100?' '+terbilang(n%100):'');
  if(n<2000) return 'seribu'+(n-1000?' '+terbilang(n-1000):'');
  if(n<1e6) return terbilang(Math.floor(n/1e3))+' ribu'+(n%1e3?' '+terbilang(n%1e3):'');
  if(n<1e9) return terbilang(Math.floor(n/1e6))+' juta'+(n%1e6?' '+terbilang(n%1e6):'');
  return terbilang(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+terbilang(n%1e9):'');
}
function toSpeech(t){
  return String(t)
    .replace(/Rp\s?(\d{1,3}(?:\.\d{3})*)/g,(m,d)=>terbilang(parseInt(d.replace(/\./g,''),10))+' rupiah')
    .replace(/50:50/g,'lima puluh lima puluh')
    .replace(AR,' ')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[\u{1F000}-\u{1FFFF}☀-➿️]/gu,'')
    .replace(/[“”"()\[\]•✦]/g,' ')
    .replace(/[‘’`]/g,'')
    .replace(/…/g,'.')
    .replace(/\s*[:—–]\s*/g,', ')
    .replace(/\s+/g,' ').replace(/\s+([.,!?])/g,'$1').replace(/,\s*([.!?])/g,'$1').trim();
}

  },
  render(text,typing){
    const h=fmt(text);
    document.querySelectorAll('.hbt').forEach(e=>{e.innerHTML=h;e.classList.toggle('typing',!!typing);});
  },
  show(text){
    clearInterval(this.ty); this.full=text;
    const h=fmt(text);
    document.querySelectorAll('.hghost').forEach(e=>{e.innerHTML=h;});
    let i=0; const L=text.length, step=Math.max(1,Math.ceil(L/80));
    const tick=()=>{ i=Math.min(L,i+step); const hh=fmt(text.slice(0,i)); document.querySelectorAll('.hbt').forEach(e=>{e.innerHTML=hh;e.classList.toggle('typing',i<L);}); if(i>=L) clearInterval(this.ty); };
    this.ty=setInterval(tick,24); tick();
  },
  talk(on){ document.body.classList.toggle('talking',!!on); },
  duck(on){
    try{ if(Aud.mus&&Aud.ctx) Aud.mus.gain.setTargetAtTime(on?(Aud.musicOn?.18:0):(Aud.musicOn?.55:0),Aud.ctx.currentTime,.15); }catch(e){}
  },
  cancelSpeech(){ try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} },
  say(text,o={}){
    if(o.now) this.stopAll();
    this.q.push({text,speech:o.speech||text});
    if(!this.busy) this.next();
  },
  stopAll(){
    this.q=[]; this.busy=false; this.gen++; clearTimeout(this.tm);
    this.cancelSpeech(); this.talk(false);
  },
  next(){
    const it=this.q.shift();
    if(!it){ this.busy=false; this.talk(false); this.duck(false); return; }
    this.busy=true; const gen=++this.gen;
    this.show(it.text); this.talk(true);
    let done=false;
    const fin=()=>{
      if(done||gen!==this.gen) return; done=true; clearTimeout(this.tm);
      this.tm=setTimeout(()=>{ if(gen===this.gen) this.next(); },380);
    };
    const canV=this.voiceOn&&this.voice&&window.speechSynthesis;
    let spoken=false;
    if(canV){
      const clean=toSpeech(it.speech);
      if(clean){
        spoken=true;
        setTimeout(()=>{
          if(gen!==this.gen) return;
          try{
            const u=new SpeechSynthesisUtterance(clean);
            u.voice=this.voice; u.lang=this.voice.lang||'id-ID'; u.rate=1.03; u.pitch=.92;
            u.onstart=()=>this.duck(true); u.onend=fin; u.onerror=fin;
            speechSynthesis.speak(u);
          }catch(e){ fin(); }
        },60);
        this.tm=setTimeout(fin,16000);
      }
    }
    if(!spoken){
      this.duck(false);
      const ms=Math.max(1800,it.text.length*46+800);
      this.tm=setTimeout(fin,ms);
      setTimeout(()=>{ if(gen===this.gen) this.talk(false); },Math.min(ms,it.text.length*26+300));
    }
  },
  skip(){
    clearInterval(this.ty); this.render(this.full,false);
    this.gen++; clearTimeout(this.tm); this.cancelSpeech();
    if(this.q.length) this.next(); else { this.busy=false; this.talk(false); this.duck(false); }
  },
  setVoice(on){
    this.voiceOn=on; store.set('kmba_hvoice',on);
    if(!on){ this.cancelSpeech(); this.duck(false); }
    syncVoiceBtns();
  }
};

function syncVoiceBtns(){
  const ok=!!Host.voice;
  const sv=$('sVoice'), gv=$('gVoice');
  if(sv) sv.textContent='🎙️ Suara Host: '+(ok?(Host.voiceOn?'ON':'OFF'):'teks saja');
  if(gv) gv.classList.toggle('off',!(ok&&Host.voiceOn));
}

/* ---------- pasang ke halaman ---------- */
(function(){
  const start=$('start');
  start.insertBefore(Host.makeRow(),start.firstChild);
  const fig=document.createElement('div'); fig.className='hfig'; fig.innerHTML='<div class="hglow"></div><div class="himg"></div>';
  start.appendChild(fig);
  document.querySelector('.stage').appendChild(Host.makeRow());
  // tombol suara host
  const sv=document.createElement('button'); sv.className='btn sec'; sv.id='sVoice'; sv.textContent='🎙️ Suara Host';
  document.querySelector('#start .row2').appendChild(sv);
  const gv=document.createElement('button'); gv.className='mini'; gv.id='gVoice'; gv.textContent='🎙️'; gv.title='Suara host';
  $('gSfx').insertAdjacentElement('afterend',gv);
  const toggle=()=>{
    if(!Host.voice){ Host.say('Perangkat ini belum punya suara bahasa Indonesia, jadi saya berbicara lewat teks saja.',{now:true}); return; }
    Host.setVoice(!Host.voiceOn);
    Host.say(Host.voiceOn?'Suara saya aktif kembali!':'Baik, saya diam dulu dan bicara lewat teks saja.',{now:true});
  };
  sv.onclick=toggle; gv.onclick=toggle;
  if('speechSynthesis' in window){
    Host.pickVoice();
    try{ speechSynthesis.onvoiceschanged=()=>Host.pickVoice(); }catch(e){}
    setTimeout(()=>Host.pickVoice(),600);
  }
  syncVoiceBtns();
})();

const _syncAB=syncAudioBtns;
syncAudioBtns=function(){ _syncAB(); syncVoiceBtns(); };

/* ---------- naskah host ---------- */
const N=()=>pname||'Pemain';
const GREET="Assalamu'alaikum! Selamat datang di Kuis Miliarder Bahasa Arab. Ketik namamu, lalu tekan Mulai Main!";
const LEVEL_LINES=[
 'Soal pertama, untuk {p}. Pemanasan dulu, ya!',
 'Soal kedua, {p}. Tetap santai.',
 'Soal ketiga, {p}. Mulai menarik nih!',
 'Soal keempat, {p}. Sedikit lagi menuju titik aman!',
 'Soal kelima, {p}! Jawab benar, dan satu juta rupiah aman di tanganmu.',
 'Soal keenam, {p}. Titik aman pertama sudah di genggaman, sekarang bermain lebih berani!',
 'Soal ketujuh, {p}. Makin menantang, ya.',
 'Soal kedelapan, {p}. Hati-hati, pilihan mulai menjebak.',
 'Soal kesembilan, {p}. Satu langkah lagi menuju titik aman kedua!',
 'Soal kesepuluh, {p}! Jawab benar, dan tiga puluh dua juta rupiah aman di tanganmu.',
 'Soal kesebelas, {p}. Tingkat sulit dimulai!',
 'Soal kedua belas, {p}. Pikirkan baik-baik, {n}.',
 'Soal ketiga belas, {p}. Tinggal tiga soal lagi menuju miliar!',
 'Soal keempat belas, {p}. Tingkat pakar. Setengah miliar rupiah dipertaruhkan!',
 'Soal terakhir! {p}! Satu miliar rupiah menantimu, {n}. Tarik napas dalam-dalam.'
];
const NUDGE=[
 'Santai saja, {n}, tidak ada batas waktu. Tapi penonton mulai penasaran!',
 'Tenang, {n}. Pikirkan baik-baik. Kamu masih punya bantuan, lho.',
 'Hmm, soal ini memang menarik. Ada pilihan yang mulai menarik hatimu?'
];
const L4=i=>'ABCD'[i];

Host.onQuestion=function(){
  this.lastAct=Date.now();
  const p=rp(PRIZES[level]);
  const line=LEVEL_LINES[level].replace('{p}',p).replace('{n}',N());
  const read=line+' '+cur.q;
  if(this.introPending){
    this.introPending=false;
    const intro=this.played>0
      ?`Siap bermain lagi, ${N()}? Ayo kita mulai!`
      :`Bismillah. Selamat datang, ${N()}! Ada lima belas soal, empat bantuan, dan dua titik aman. Kita mulai dari soal pertama.`;
    this.say(intro,{now:true});
    this.say(line,{speech:read});
  } else {
    this.say(line,{speech:read});
  }
};

const _loadQ=loadQuestion;
loadQuestion=function(){ _loadQ(); Host.onQuestion(); };

const _startG=startGame;
startGame=function(){ Host.introPending=true; _startG(); Host.played++; };
$('btnStart').onclick=startGame;

const _choose=choose;
choose=function(i){
  const before=selected;
  _choose(i);
  if(locked||selected!==i||before===i) return;
  Host.lastAct=Date.now();
  Host.say(pick([`Jawaban ${L4(i)}? Yakin, ${N()}?`,`Kamu memilih ${L4(i)}. Mau dikunci?`,`${L4(i)}... Kamu yakin?`]),{now:true});
};

const _lock3=lockAnswer;
lockAnswer=function(){
  const was=locked; _lock3();
  if(!was&&locked){
    Host.say('Jawaban dikunci!',{now:true});
    Host.say(pick(['Dan jawabannya adalah...','Mari kita lihat... apakah benar?','Jantungmu berdebar? Kita lihat jawabannya...']));
  }
};

const _reveal3=reveal;
reveal=function(){
  const correct=cur.opts.findIndex(o=>o.ok), ok=(selected===correct);
  const p=rp(PRIZES[level]);
  if(ok){
    if(level===14) Host.say(`Allahu akbar! ${N()}, kamu menjadi miliarder bahasa Arab! ${p}!`,{now:true});
    else if(SAFE.includes(level)) Host.say(`Masya Allah, benar! Titik aman tercapai. ${p} dijamin milikmu, ${N()}!`,{now:true});
    else Host.say(pick([`Benar sekali! ${p} jadi milikmu.`,`Tepat! Kamu membawa ${p}, ${N()}.`,`Masya Allah, benar! ${p}!`]),{now:true});
  } else {
    const t=cur.opts[correct].t, hasAr=/[؀-ۿ]/.test(t);
    Host.say(`Aduh, sayang sekali! Jawaban yang benar adalah ${L4(correct)}: ${t}.`,{now:true,
      speech:`Aduh, sayang sekali! Jawaban yang benar adalah ${L4(correct)}${hasAr?'':', '+t}.`});
  }
  _reveal3();
};

const _useLife=useLife;
useLife=function(k,b){
  _useLife(k,b); Host.lastAct=Date.now();
  if(k==='fifty') Host.say('Baik! Dua jawaban yang salah kami hilangkan.',{now:true});
  else if(k==='phone') Host.say(`Kita hubungi temanmu sekarang. Halo? Ada pertanyaan dari ${N()}!`,{now:true});
  else if(k==='aud') Host.say('Penonton, silakan voting! Tiga, dua, satu...',{now:true});
  else if(k==='swap') setTimeout(()=>Host.say('Soal diganti! Ini soal barunya.',{now:true,speech:'Soal diganti! Ini soal barunya. '+cur.q}),80);
};

const _endG=endGame;
endGame=function(kind,w){
  _endG(kind,w);
  const amt=kind==='win'?PRIZES[14]:kind==='walk'?w:safePrize();
  const p=rp(amt);
  let t;
  if(kind==='win') t=`Selamat, ${N()}! Kamu resmi miliarder bahasa Arab. Barakallahu fiik!`;
  else if(kind==='walk') t=`Keputusan yang bijak, ${N()}! Kamu pulang membawa ${p}.`;
  else t=amt>0?`Jangan sedih, ${N()}. Kamu tetap pulang membawa ${p}. Terus belajar, ya!`:`Jangan sedih, ${N()}. Kamu pulang tanpa hadiah, tapi ilmumu bertambah. Coba lagi, ya!`;
  const btns=$('modalBox').querySelector('.btns');
  if(btns) btns.insertAdjacentHTML('beforebegin',`<div class="hnote"><div class="hmini"></div><div class="hq">${fmt(t)}</div></div>`);
  Host.say(t,{now:true});
};

const _toMenu=toMenu;
toMenu=function(){ _toMenu(); Host.say('Selamat datang kembali! Siap mencoba lagi meraih satu miliar?',{now:true}); };

$('btnHow').addEventListener('click',()=>Host.say('Aturannya mudah. Jawab lima belas soal dengan benar. Titik aman ada di soal lima dan sepuluh. Kamu punya empat bantuan.',{now:true}));
$('btnWalk').addEventListener('click',()=>{ if(!locked&&!$('game').classList.contains('hidden')) Host.say(`Yakin mau berhenti, ${N()}? Hadiahmu sekarang ${rp(wonPrize())}.`,{now:true}); });

/* ---------- salam pembuka & penyemangat ---------- */
Host.show(GREET); Host.full=GREET;
Host.pendingGreet=GREET;
addEventListener('pointerdown',()=>{
  Host.lastAct=Date.now();
  if(Host.pendingGreet){
    const g=Host.pendingGreet; Host.pendingGreet=null;
    if(Host.voiceOn&&Host.voice&&$('game').classList.contains('hidden')&&!Host.busy){
      try{ const u=new SpeechSynthesisUtterance(toSpeech(g)); u.voice=Host.voice; u.lang=Host.voice.lang||'id-ID'; u.rate=1.03; u.pitch=.92; u.onstart=()=>Host.duck(true); u.onend=()=>Host.duck(false); u.onerror=u.onend; speechSynthesis.speak(u); }catch(e){}
    }
  }
},{capture:true});
addEventListener('keydown',()=>{ Host.lastAct=Date.now(); },{capture:true});
setInterval(()=>{
  if($('game').classList.contains('hidden')||!$('modal').classList.contains('hidden')||locked||document.hidden||Host.busy) return;
  const idle=(Date.now()-Host.lastAct)/1000;
  if(selected===null&&idle>32){ Host.lastAct=Date.now(); Host.say(pick(NUDGE).replace('{n}',N())); }
  else if(selected!==null&&idle>20){ Host.lastAct=Date.now(); Host.say(`Sudah yakin dengan jawaban ${L4(selected)}, ${N()}? Tekan Kunci Jawaban kalau sudah mantap.`); }
},1000);
</script>
